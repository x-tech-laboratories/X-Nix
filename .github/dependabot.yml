version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # X-Libs and Halon in one pull request, so the Halon peer of X-Libs matches; the only group that merges on its own, after its provenance check.
      x-tech:
        patterns: ["@x-tech-laboratories/*"]
      # Third-party patch and minor updates in one pull request for a person to merge; a major update comes on its own.
      npm:
        patterns: ["*"]
        exclude-patterns: ["@x-tech-laboratories/*"]
        update-types: [minor, patch]
    ignore:
      # The types follow the Node runtime, 24 in CI and the flakes, so their majors move with it by hand.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    # Our own releases skip the default 3-day cooldown, which X-Libs outpaces several times a day.
    # Revisit once X-Libs stabilizes and releases slow down.
    cooldown:
      exclude: ["@x-tech-laboratories/*"]
  # Keeps the workflows' actions, pinned by commit, on their latest releases, each for a person to merge.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
