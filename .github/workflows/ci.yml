name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run lint
  # Refreshes a stale Nix npm deps hash on a pull request, and fails on one elsewhere.
  npm-deps-hash:
    uses: x-tech-laboratories/X-Libs/.github/workflows/npm-deps-hash.yml@main
    permissions:
      contents: write
      actions: write
