name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm audit signatures
      # X-Libs and Halon merge on their own only when npm's provenance shows they were built from our own repositories.
      - if: steps.meta.outputs.dependency-group == 'x-tech'
        run: node .github/scripts/check-provenance.mjs
      # X-Libs and Halon merge at any version, since each 0.x minor of theirs breaks and CI with the nix build is the gate;
      # other packages merge only for patch and minor updates. The required checks on main still decide when.
      - if: >-
          steps.meta.outputs.dependency-group == 'x-tech' ||
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
